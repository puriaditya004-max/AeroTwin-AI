[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "m2-twin-engine"
version = "1.0.0"
description = "AeroTwin AI - M2 Digital Twin and State Estimation Service"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "numpy>=1.26.0",
    "pyyaml>=6.0.1",
    "redis>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
include = ["app*", "sync*", "state*", "stream*", "storage*", "ingest*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
