version: "1.0.0"
window_seconds: 30
features:
  - name: "load"
    unit: "%"
  - name: "tempMarginC"
    unit: "C"
  - name: "pressureMarginKpa"
    unit: "kPa"
  - name: "vibrationMarginMmS"
    unit: "mm/s"
  - name: "rollingMeanRpm"
    unit: "RPM"
  - name: "rollingStdVibration"
    unit: "mm/s"
  - name: "rateOfChangeOilTempCPerMin"
    unit: "C/min"
  - name: "window_mean_tempMarginC"
    unit: "C"
  - name: "window_std_tempMarginC"
    unit: "C"
  - name: "window_slope_tempMarginC"
    unit: "C/s"
  - name: "window_mean_pressureMarginKpa"
    unit: "kPa"
  - name: "window_std_pressureMarginKpa"
    unit: "kPa"
  - name: "window_slope_pressureMarginKpa"
    unit: "kPa"
  - name: "window_mean_vibrationMarginMmS"
    unit: "mm/s"
  - name: "window_std_vibrationMarginMmS"
    unit: "mm/s"
  - name: "syncLagMs"
    unit: "ms"
